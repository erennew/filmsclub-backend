<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230b0c10'/%3E%3Ccircle cx='8' cy='8' r='3' fill='%23d9a65c'/%3E%3C/svg%3E" type="image/svg+xml" />
    <title>Stream</title>
    <style>
        video {
            display: none;
        }
    </style>
</head>
<body>

    <video id="videoPlayer" controls playsinline></video>

    <script>
        async function fetchJSON(url) {
            const response = await fetch(url);
            return response.json();
        }

        async function initPlayer() {
            const tmdbId = `{{ id }}`;
            const seasonId = `{{ season }}`;
            const episodeId = `{{ episode }}`;

            let apiUrl = seasonId !== "None" && episodeId !== "None"
                ? `/api/id/${tmdbId}?season_number=${seasonId}&episode_number=${episodeId}`
                : `/api/id/${tmdbId}`;

            const data = await fetchJSON(apiUrl);

            const videoElement = document.getElementById("videoPlayer");

            // Choose the highest quality available
            if (data.sources.length > 0) {
                const bestQuality = data.sources.reduce((prev, curr) => 
                    parseInt(curr.quality) > parseInt(prev.quality) ? curr : prev
                );

                videoElement.src = `/dl/${bestQuality.id}/${encodeURIComponent(bestQuality.name)}`;
                videoElement.poster = `https://image.tmdb.org/t/p/original${data.backdrop}`;
            }
        }

        // Initialize the player on page load
        initPlayer();
    </script>

</body>
</html>
