    <!-- Premium Fonts -->
    <!--
      This stylesheet is cross-origin and was a plain render-blocking <link>, so
      every cold launch painted nothing until Google Fonts responded. On a slow
      mobile connection that is the difference between an instant splash and a
      blank screen. It is now loaded asynchronously: `media="print"` makes it
      non-blocking, and the onload handler flips it to `all` once it arrives.

      `display=swap` is already in the URL, so text renders in the fallback face
      immediately and swaps when the webfont lands — no invisible text. The
      <noscript> copy covers the (rare) no-JS case, where blocking is harmless.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>

        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"

  <body>
    <!--
      Boot shell.

      #root used to be an empty div. If the entry bundle failed to load or threw
      during module init — a stale index.html pointing at a bundle hash a later
      deploy deleted, a blocked/aborted chunk, a corrupt SW response — nothing
      painted, and because the document canvas defaulted to white the user got a
      completely blank white page with no way to recover (measured: 100% white,
      mean luminance 255, zero children in #root).

      This markup is static, inline-styled and dependency-free, so it renders
      before any CSS or JS and survives both failing. React replaces it on mount
      (main.jsx clears #root). The retry button only appears if the module never
      executes, which the handler below detects.
    -->
    <div
      id="root"
      style="min-height: 100vh; background: #08090b; color: #f2ede3; font-family: system-ui, -apple-system, sans-serif"
    >
      <div
        id="boot-shell"
        style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.25rem; padding: 1.5rem; text-align: center"
      >
        <svg width="56" height="56" viewBox="0 0 26 26" fill="none" aria-hidden="true">
          <defs>
            <linearGradient id="bootBrand" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#F0CA98" />
              <stop offset="100%" stop-color="#D9A65C" />
            </linearGradient>
          </defs>
          <path
            d="M5,9 C5,5.5 7.5,3 11,3.5 C12.5,2 15,1.5 17,3 C19.5,3 21,5 21,7.5 C23,8.5 24,10.5 23,13 C22,15.5 19.5,16 17,16 L9,16 C6.5,16 4,14 4,11.5 C4,10 4.5,9.2 5,9 Z"
            fill="url(#bootBrand)"
          />
        </svg>
        <noscript>
          <p style="font-size: 0.9rem; color: #a8a49b; max-width: 22rem; line-height: 1.6">
            CloudXMovies needs JavaScript to play films. Please enable it in your
            browser settings and reload.
          </p>
        </noscript>
        <div id="boot-error" style="display: none; max-width: 22rem">
          <p style="font-size: 0.95rem; margin: 0 0 0.5rem">
            The app didn&rsquo;t finish loading.
          </p>
          <p style="font-size: 0.8rem; color: #a8a49b; margin: 0 0 1.25rem; line-height: 1.6">
            Usually a stale cached file. Reloading fixes it.
          </p>
          <button
            type="button"
            onclick="location.reload()"
            style="background: #e9b872; color: #08090b; border: 0; border-radius: 3px; padding: 0.65rem 1.35rem; font-size: 0.85rem; font-weight: 600; cursor: pointer"
          >
            Reload
          </button>
        </div>
      </div>
    </div>
    <script>
      /*
       * Detect a failed entry-bundle load. `error` on a module script does not
       * bubble as a normal event, so listen in the capture phase. A 4s timeout
       * covers the case where the request hangs rather than errors.
       *
       * If React mounted, #root no longer contains #boot-shell and this is a
       * no-op.
       */
      (function () {
        var revealed = false;
        function reveal() {
          if (revealed) return;
          var shell = document.getElementById("boot-shell");
          if (!shell || !document.body.contains(shell)) return; // app booted
          var box = document.getElementById("boot-error");
          if (box) box.style.display = "block";
          revealed = true;
        }
        window.addEventListener("error", function (e) {
          var t = e && e.target;
          if (t && t.tagName === "SCRIPT") reveal();
        }, true);
        window.addEventListener("unhandledrejection", function (e) {
          var m = (e && e.reason && (e.reason.message || String(e.reason))) || "";
          if (/Importing a module script failed|Failed to fetch dynamically imported module|error loading dynamically imported module/i.test(m)) reveal();
        });
        setTimeout(reveal, 4000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
