<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C17" />
      <stop offset="50%" stop-color="#0B1020" />
      <stop offset="100%" stop-color="#050810" />
    </linearGradient>

    <!-- Electric Blue to Cyan Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Luxury Canvas -->
  <rect width="800" height="500" fill="url(#bgGrad)" />

  <!-- Ambient Glow Behind Symbol -->
  <circle cx="400" cy="190" r="140" fill="#2563EB" opacity="0.12" filter="url(#subtleGlow)" />
  <circle cx="400" cy="190" r="80" fill="#06B6D4" opacity="0.15" filter="url(#subtleGlow)" />

  <!-- Abstract Geometric CloudX Emblem -->
  <g transform="translate(400, 185)" filter="url(#subtleGlow)">
    <!-- Outer Floating Cloud Ribbon (Upper Arc) -->
    <path d="M-80,-10 C-80,-60 -30,-85 20,-75 C50,-70 85,-45 85,5 C85,35 60,65 20,65 C-25,65 -60,40 -40,0 C-30,-20 -5,-30 20,-20 C40,-12 50,5 35,25 C25,38 0,40 -20,25" 
          fill="none" stroke="url(#brandGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Speed Stream Blade (Interlocking X-Flow) -->
    <path d="M-60,40 C-30,-30 30,-50 70,-15 C90,5 60,50 10,45 C-30,40 -60,10 -20,-45 C0,-70 50,-65 75,-40" 
          fill="none" stroke="url(#brandGrad)" stroke-width="12" opacity="0.85" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Negative Space Center Precision Core -->
    <circle cx="0" cy="-5" r="12" fill="#06B6D4" opacity="0.9" />
  </g>

  <!-- Typography -->
  <g text-anchor="middle">
    <text x="400" y="380" font-family="'Outfit', 'Inter', system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" letter-spacing="4">
      <tspan fill="url(#brandGrad)">CloudX</tspan><tspan fill="#FFFFFF">Movies</tspan>
    </text>
    <text x="400" y="415" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="rgba(255,255,255,0.4)" letter-spacing="10">
      PREMIUM STREAMING PLATFORM
    </text>
  </g>
</svg>
